name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency: { group: pages, cancel-in-progress: true }
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: { name: github-pages, url: "${{ steps.deploy.outputs.page_url }}" }
    steps:
      - uses: actions/checkout@v4
      - id: cfg
        continue-on-error: true   # until Pages is switched on in Settings, this step fails and the deploy is skipped
        uses: actions/configure-pages@v5
        with: { enablement: true }
      - if: steps.cfg.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with: { path: . }
      - id: deploy
        if: steps.cfg.outcome == 'success'
        uses: actions/deploy-pages@v4
      - if: steps.cfg.outcome != 'success'
        run: 'echo "GitHub Pages is not enabled yet. Skipped deploy."'
